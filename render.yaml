services:
  - type: web
    name: pexydrop
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: TRANSFER_STORAGE
        value: /tmp/pexydrop-files
      - key: TRANSFER_PASSWORD
        sync: false